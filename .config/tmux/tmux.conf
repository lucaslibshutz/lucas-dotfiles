# ══════════════════════════════════════════════════════════
#  tmux.conf — WSL edition
#  Theme: Catppuccin Mocha
# ══════════════════════════════════════════════════════════

# ── Terminal ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true color
set -g escape-time 10                              # faster key sequences (important for nvim)
set -g focus-events on                             # pass focus events to apps

# ── Prefix ───────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ── General ──────────────────────────────────────────────
set -g mouse on
set -g base-index 1          # start window index at 1
set -g pane-base-index 1     # start pane index at 1
set -g renumber-windows on   # renumber on close
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g aggressive-resize on

# ── Vi mode ──────────────────────────────────────────────
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v   send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y   send -X copy-pipe-and-cancel "clip.exe"   # WSL clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# ── Window / pane splits ─────────────────────────────────
unbind %
unbind '"'
bind '\' split-window -h -c "#{pane_current_path}"   # vertical split
bind '-'  split-window -v -c "#{pane_current_path}"  # horizontal split
bind c    new-window      -c "#{pane_current_path}"  # new window keeps path

# ── Pane navigation (Ctrl+hjkl, works with vim-tmux-navigator) ──
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ── Pane resizing ─────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z   # toggle zoom/maximize

# ── Window navigation ─────────────────────────────────────
bind -r Right next-window
bind -r Left  previous-window
bind Tab      last-window    # toggle last active window

# ── Reload config ─────────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ── Session management ────────────────────────────────────
bind-key S choose-session   # pick session
bind-key N new-session      # new session

# ══════════════════════════════════════════════════════════
#  Catppuccin Mocha color palette
# ══════════════════════════════════════════════════════════
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f38ba8"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black4="#585b70"

# ── Status bar ────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=$thm_bg,fg=$thm_fg"

set -g status-left-length 100
set -g status-right-length 100

set -g status-left \
  "#[fg=$thm_black,bg=$thm_blue,bold] 󰣇 #S #[fg=$thm_blue,bg=$thm_bg]"

set -g status-right \
  "#[fg=$thm_gray,bg=$thm_bg]#[fg=$thm_fg,bg=$thm_gray] 󰃰 %H:%M #[fg=$thm_blue,bg=$thm_gray]#[fg=$thm_black,bg=$thm_blue,bold]  #h "

# Window status
setw -g window-status-style "fg=$thm_black4,bg=$thm_bg"
setw -g window-status-format \
  "#[fg=$thm_bg,bg=$thm_bg]#[fg=$thm_black4] #I  #{b:pane_current_path} #[fg=$thm_bg,bg=$thm_bg]"

setw -g window-status-current-style "fg=$thm_blue,bg=$thm_bg,bold"
setw -g window-status-current-format \
  "#[fg=$thm_bg,bg=$thm_gray]#[fg=$thm_blue,bg=$thm_gray,bold] #I  #{b:pane_current_path} #[fg=$thm_gray,bg=$thm_bg]"

setw -g window-status-separator ""
setw -g window-status-activity-style "fg=$thm_yellow,bg=$thm_bg,underscore"

# Pane borders
set -g pane-border-style        "fg=$thm_gray"
set -g pane-active-border-style "fg=$thm_blue"

# Messages
set -g message-style         "fg=$thm_yellow,bg=$thm_black,bold"
set -g message-command-style "fg=$thm_blue,bg=$thm_black,bold"

# Mode (copy mode selection)
set -g mode-style "fg=$thm_bg,bg=$thm_blue"

# ── Plugins (TPM) ─────────────────────────────────────────
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'       # sensible defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'      # persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save/restore sessions
set -g @plugin 'tmux-plugins/tmux-yank'           # better yank
set -g @plugin 'christoomey/vim-tmux-navigator'   # seamless nvim ↔ tmux navigation

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'   # save every 10 minutes

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
